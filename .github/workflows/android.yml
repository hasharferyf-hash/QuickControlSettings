name: Android CI

on:
  push:
    branches: [ "main", "codex/fix-flicker" ]
    tags: [ "v*", "[0-9]*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (for example: 0.2.0)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK (pull requests only)
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/codex/fix-flicker'
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug

      - name: Enable KVM for emulator
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/codex/fix-flicker'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Check RTL, themes and large text on Android 15
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/codex/fix-flicker'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            gradle :app:connectedDebugAndroidTest
            adb pull /data/local/tmp/quickcontrol-qa ui-screenshots
            test -s ui-screenshots/01-light.png
            test -s ui-screenshots/02-dark.png
            test -s ui-screenshots/03-large-text.png

      - name: Upload UI checks and screenshots
        if: always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/codex/fix-flicker')
        uses: actions/upload-artifact@v4
        with:
          name: QuickControlSettings-ui-checks
          path: |
            ui-screenshots
            app/build/reports/androidTests
            app/build/reports/lint-results-debug.html

      - name: Upload debug APK
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/codex/fix-flicker'
        uses: actions/upload-artifact@v4
        with:
          name: QuickControlSettings-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare release signing key
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 repository secret"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD repository secret"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS repository secret"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD repository secret"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/quickcontrol-release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/quickcontrol-release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        env:
          APP_VERSION_NAME: ${{ github.ref == 'refs/heads/codex/fix-flicker' && '0.2.47' || '' }}
          APP_VERSION_CODE: ${{ github.ref == 'refs/heads/codex/fix-flicker' && '47' || '' }}
        run: gradle :app:assembleRelease

      - name: Upload signed release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: QuickControlSettings-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish APK to GitHub Releases
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Quick Control Settings ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk

      - name: Verify developer signature for flicker hotfix
        if: github.ref == 'refs/heads/codex/fix-flicker'
        shell: bash
        run: |
          set -euo pipefail
          signer="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          curl --fail --location --retry 3 "https://github.com/hasharferyf-hash/QuickControlSettings/releases/download/v0.2.46/QuickControlSettings-0.2.46.apk" --output "$RUNNER_TEMP/previous.apk"
          previous="$("$signer" verify --print-certs "$RUNNER_TEMP/previous.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          current="$("$signer" verify --print-certs app/build/outputs/apk/release/app-release.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          test -n "$previous"
          test "$previous" = "$current" || { echo "Developer signature mismatch"; exit 1; }
          cp app/build/outputs/apk/release/app-release.apk QuickControlSettings-0.2.47.apk
          sha256sum QuickControlSettings-0.2.47.apk > SHA256SUMS.txt
          printf 'Signing certificate SHA-256: %s\nMatches developer release v0.2.46: yes\n' "$current" > signature-verification.txt
          cat signature-verification.txt

      - name: Publish verified flicker fix
        if: github.ref == 'refs/heads/codex/fix-flicker'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.47
          target_commitish: ${{ github.sha }}
          name: Quick Control Settings 0.2.47 — תיקון הבהוב
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            תיקון הבהוב המסך בזמן שינוי הגדרות ועדכוני סוללה ופנס.
            עדכוני מצב מעדכנים את הכפתורים והערכים הקיימים בלי לבנות מחדש את המסך, לאפס גלילה או להחליף מחוונים בזמן גרירה.
            נבדק על Android 15, כולל בדיקת רגרסיה לעדכונים חוזרים ולמחוון בזמן מגע.
            APK מסוג Release, חתום במפתח הפרויקט. תעודת החתימה אומתה מול גרסה 0.2.46 של המפתח.
          files: |
            QuickControlSettings-0.2.47.apk
            SHA256SUMS.txt
            signature-verification.txt
