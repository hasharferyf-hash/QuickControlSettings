name: Publish verified developer-signed APK 0.2.47

on:
  push:
    branches: [ "release/publish-0.2.47" ]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up APK verification tools
        uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;35.0.0"

      - name: Download the existing signed main build
        uses: actions/download-artifact@v4
        with:
          name: QuickControlSettings-release
          path: release
          run-id: 43389979659
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Verify developer signature and package version
        shell: bash
        run: |
          set -euo pipefail
          apk="release/app-release.apk"
          test -s "$apk"
          curl --fail --location --retry 3 \
            "https://github.com/hasharferyf-hash/QuickControlSettings/releases/download/v0.2.0/app-release.apk" \
            --output "$RUNNER_TEMP/developer-previous.apk"
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          previous="$("$signer" verify --print-certs "$RUNNER_TEMP/developer-previous.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          current="$("$signer" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          test -n "$previous"
          test "$current" = "$previous" || { echo "Developer signing certificate mismatch; refusing publication."; exit 1; }
          "$aapt" dump badging "$apk" | sed -n '1p' > release/package-info.txt
          grep -Fq "package: name='QuickControlSettings.brisker.AI' versionCode='47' versionName='0.2.47'" release/package-info.txt
          mv "$apk" release/QuickControlSettings-0.2.47.apk
          printf 'Signing certificate SHA-256: %s\nMatches developer release v0.2.0: yes\nSource commit: ab09b99b63b0887a39147d08966f94925ff0c7e2\nSource build: 43389979659\n' "$current" > release/signature-verification.txt
          (cd release && sha256sum QuickControlSettings-0.2.47.apk > SHA256SUMS.txt)
          cat release/signature-verification.txt

      - name: Publish verified APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.47
          target_commitish: ab09b99b63b0887a39147d08966f94925ff0c7e2
          name: Quick Control Settings 0.2.47
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            תיקון הבהוב המסך בזמן שינוי הגדרות ועדכוני סוללה ופנס.
            עדכוני מצב מעדכנים כעת את הכפתורים והערכים הקיימים, בלי לבנות מחדש את המסך, לאפס גלילה או להחליף מחוונים בזמן גרירה.
            עברו בנייה, Android Lint ושתי בדיקות ממשק על Android 15, כולל בדיקת רגרסיה לעדכוני סוללה חוזרים ומגע במחוון.
            APK מסוג Release, גרסה 0.2.47 (47), חתום במפתח הריליס של הפרויקט. תעודת החתימה אומתה מול גרסה v0.2.0 של המפתח.
            דוח בדיקות: https://github.com/hasharferyf-hash/QuickControlSettings/actions/runs/43389979659
          files: |
            release/QuickControlSettings-0.2.47.apk
            release/signature-verification.txt
            release/SHA256SUMS.txt
            release/package-info.txt
